<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));

function parseISO(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return null;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return (d.getFullYear() === +m[1] && d.getMonth() === +m[2] - 1 && d.getDate() === +m[3]) ? d : null;
}

const DEFAULT_PARAMS_2026 = {
  anio: 2026,
  isr: {
    tramos: [
      { hasta: 228324.32, tasa: 0 },
      { hasta: 348154.10, tasa: 0.15 },
      { hasta: 809660.72, tasa: 0.20 },
      { hasta: null, tasa: 0.25 }
    ],
    gastosMedicosTope: 40000
  },
  ihss: { techoEM: 11903.13, techoIVM: 12498.29, emEmp: 0.025, emPat: 0.05, ivmEmp: 0.025, ivmPat: 0.035 },
  rap: { piso: 11903.13, techo: 0, tasaEmp: 0.015, tasaPat: 0.015 },
  infop: { tasa: 0.01 },
  jornada: { horasDiurna: 8, horasNocturna: 6, horasMixta: 7 },
  recargos: { extraDiurna: 0.25, extraNocturna: 0.50, extraJornadaNocturna: 0.75 },
  salarioMinimoPromedio: 14917.20
};

// Salario vigente de un empleado en un mes (considera aumentos con fecha "desde" AAAA-MM)
function salarioEn(emp, y, m) {
  let s = num(emp.salario);
  const key = y * 100 + m;
  const cambios = (emp.cambios || []).filter(c => /^\d{4}-\d{2}/.test(c.desde || '')).slice().sort((a, b) => a.desde < b.desde ? -1 : 1);
  for (const c of cambios) {
    const mm = /^(\d{4})-(\d{2})/.exec(c.desde);
    if ((+mm[1]) * 100 + (+mm[2]) <= key) s = num(c.salario);
  }
  return s;
}

// Días pagados (base 30) del empleado en el mes, o null si no estaba activo
function diasPagadosMes(emp, y, m) {
  const ini = parseISO(emp.ingreso);
  if (!ini) return null;
  const ret = emp.retiro ? parseISO(emp.retiro) : null;
  const firstDay = new Date(y, m - 1, 1), lastDay = new Date(y, m, 0);
  if (ini > lastDay) return null;
  if (ret && ret < firstDay) return null;
  let desde = 1, hasta = 30;
  if (ini > firstDay) desde = Math.min(ini.getDate(), 30);
  if (ret && ret <= lastDay) hasta = Math.min(ret.getDate(), 30);
  return Math.max(0, hasta - desde + 1);
}

function horasJornada(emp, p) {
  if (emp.jornada === 'Nocturna') return p.jornada.horasNocturna;
  if (emp.jornada === 'Mixta') return p.jornada.horasMixta;
  return p.jornada.horasDiurna;
}

function isrAnual(renta, tramos) {
  let prev = 0, tax = 0;
  for (const t of tramos) {
    const top = (t.hasta == null || t.hasta === '') ? Infinity : num(t.hasta);
    if (renta > prev) tax += (Math.min(renta, top) - prev) * num(t.tasa);
    prev = top;
    if (renta <= top) break;
  }
  return r2(tax);
}

// Calcula un mes de un empleado. acc = { ingreso, isr } acumulados del año antes de este mes.
function calcMes(emp, y, m, nov, p, acc) {
  const dias = diasPagadosMes(emp, y, m);
  if (dias === null) return null;
  nov = nov || {};
  const sal = salarioEn(emp, y, m);
  const ausencias = Math.min(dias, Math.max(0, num(nov.diasAusencia)));
  const diasPag = dias - ausencias;
  const sueldo = r2(sal / 30 * diasPag);
  const tarifa = sal / 30 / horasJornada(emp, p);
  const heD = r2(tarifa * (1 + p.recargos.extraDiurna) * num(nov.heDiurna));
  const heN = r2(tarifa * (1 + p.recargos.extraNocturna) * num(nov.heNocturna));
  const heJ = r2(tarifa * (1 + p.recargos.extraJornadaNocturna) * num(nov.heJornadaNocturna));
  const horasExtra = r2(heD + heN + heJ);
  const bonos = r2(num(nov.bonos)), comisiones = r2(num(nov.comisiones));
  const bruto = r2(sueldo + horasExtra + bonos + comisiones);

  const baseEM = Math.min(bruto, p.ihss.techoEM), baseIVM = Math.min(bruto, p.ihss.techoIVM);
  const ihssEmp = emp.ihss ? r2(baseEM * p.ihss.emEmp + baseIVM * p.ihss.ivmEmp) : 0;
  const ihssPat = emp.ihss ? r2(baseEM * p.ihss.emPat + baseIVM * p.ihss.ivmPat) : 0;
  const techoRap = p.rap.techo > 0 ? p.rap.techo : Infinity;
  const baseRap = emp.rap ? Math.max(0, Math.min(bruto, techoRap) - p.rap.piso) : 0;
  const rapEmp = r2(baseRap * p.rap.tasaEmp), rapPat = r2(baseRap * p.rap.tasaPat);
  const infop = r2(bruto * p.infop.tasa);

  // ISR: proyección anual con recálculo cada mes
  const ret = emp.retiro ? parseISO(emp.retiro) : null;
  const mesFinal = (ret && ret.getFullYear() === y) ? ret.getMonth() + 1 : 12;
  const mesesRest = Math.max(1, mesFinal - m + 1);
  let proyRest = 0;
  for (let k = m + 1; k <= mesFinal; k++) proyRest += (diasPagadosMes(emp, y, k) || 0) / 30 * salarioEn(emp, y, k);
  const proyectado = r2(acc.ingreso + bruto + proyRest);
  const gm = Math.min(Math.max(0, num(emp.gastosMedicos)), p.isr.gastosMedicosTope);
  const renta = Math.max(0, r2(proyectado - gm));
  const isrAnualV = isrAnual(renta, p.isr.tramos);
  const porRetener = r2(isrAnualV - acc.isr);
  const isr = Math.max(0, r2(porRetener / mesesRest));

  const judicial = r2(num(emp.descuentoJudicial));
  const otrasFijas = r2(num(emp.otrasFijas));
  const anticipos = r2(num(nov.anticipos));
  const otrasMes = r2(num(nov.otrasDeducciones));
  const deducciones = r2(ihssEmp + rapEmp + isr + judicial + otrasFijas + anticipos + otrasMes);
  const neto = r2(bruto - deducciones);

  return {
    salario: sal, dias, ausencias, diasPag, sueldo, heD, heN, heJ, horasExtra, bonos, comisiones, bruto,
    ihssEmp, rapEmp, isr, judicial, otrasFijas, anticipos, otrasMes, deducciones, neto,
    ihssPat, rapPat, infop, costoPatrono: r2(ihssPat + rapPat + infop),
    detalleIsr: { proyectado, ingresoPrevio: r2(acc.ingreso), gastosMedicos: gm, renta, isrAnual: isrAnualV, retenidoPrevio: r2(acc.isr), mesesRest, porRetener, negativo: porRetener < 0 }
  };
}

// Calcula la cadena desde el saldo inicial (o enero) hasta el mes m. Devuelve resultado de m, null (no activo) o 'saldo'.
function calcHasta(emp, y, m, novFn, p) {
  let acc = { ingreso: 0, isr: 0 }, start = 1;
  const s = emp.saldo;
  if (s && num(s.anio) === y && num(s.hasta) > 0) {
    acc = { ingreso: num(s.ingreso), isr: num(s.isr) };
    start = Math.min(12, Math.round(num(s.hasta))) + 1;
    if (m < start) return 'saldo';
  }
  let res = null;
  for (let k = start; k <= m; k++) {
    const r = calcMes(emp, y, k, novFn(y, k, emp.id), p, acc);
    if (r) acc = { ingreso: acc.ingreso + r.bruto, isr: acc.isr + r.isr };
    if (k === m) res = r;
  }
  return res;
}

// Décimo tercer (1 ene a 31 dic) y décimo cuarto (1 jul año anterior a 30 jun): suma de salarios del período / 12
function calcDecimo(emp, tipo, y, opts) {
  opts = opts || {};
  const ini = tipo === 13 ? [y, 1] : [y - 1, 7];
  const fin = tipo === 13 ? [y, 12] : [y, 6];
  const filas = [];
  let yy = ini[0], mm = ini[1];
  while (yy * 100 + mm <= fin[0] * 100 + fin[1]) {
    const dias = diasPagadosMes(emp, yy, mm);
    if (dias !== null) {
      const sal = salarioEn(emp, yy, mm);
      filas.push({ y: yy, m: mm, dias, fraccion: dias / 30, salario: sal, aporte: r2(sal * dias / 30) });
    }
    mm++; if (mm > 12) { mm = 1; yy++; }
  }
  const meses = filas.reduce((a, f) => a + f.fraccion, 0);
  const suma = r2(filas.reduce((a, f) => a + f.aporte, 0));
  const base = r2(suma / 12);
  const variable = opts.incluirVariables ? r2(num(opts.promedioVariable) * meses / 12) : 0;
  return { tipo, y, periodo: { desde: ini, hasta: fin }, filas, meses: Math.round(meses * 10000) / 10000, suma, base, variable, total: r2(base + variable) };
}

  if (f.retiro && parseISO(f.retiro) && parseISO(f.ingreso) && parseISO(f.retiro) < parseISO(f.ingreso)) errs.push('El retiro no puede ser antes del ingreso.');
  if (!(num(f.salario) > 0)) errs.push('El salario debe ser mayor que 0.');
  return errs;
}
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'clear-demo': S = makeEmpty(); S.sel.mes = new Date().getMonth() + 1; save(); ui.imp = ui.form = null; render(); toast('Datos de ejemplo borrados.'); break;
    case 'confirm-no': ui.confirm = null; ui.stash = null; render(); break;
    case 'backup': { const blob = JSON.stringify(S, null, 1); S.lastBackup = new Date().toISOString(); save(); await saveFile('nominahn-respaldo-' + S.lastBackup.slice(0, 10) + '.json', blob); render(); break; }
    case 'backup-apply': if (ui.stash) { S = ui.stash; save(); } ui.stash = null; ui.confirm = null; render(); toast('Respaldo importado.'); break;
    case 'params-copy': { const from = +t.dataset.from, to = +t.dataset.to; if (S.params[from] && !S.params[to]) { S.params[to] = clone(S.params[from]); S.params[to].anio = to; delete S.params[to].val; save(); ui.pyear = to; render(); toast(`Parámetros de ${to} creados. Revísalos.`); } break; }
    case 'val-group': { const p = S.params[ui.pyear]; if (!p) break; const its = paramItems(p).filter(i => i.g === t.dataset.g); p.val = p.val || {}; const all = its.every(i => p.val[i.key]); its.forEach(i => { if (all) delete p.val[i.key]; else p.val[i.key] = hoyISO(); }); save(); render(); break; }
    case 'params-reset': { const y = +t.dataset.y; const d = clone(DEFAULT_PARAMS_2026); d.anio = y; S.params[y] = d; save(); render(); toast('Valores de referencia restablecidos.'); break; }
    case 'emp-new': ui.form = blankForm(); ui.imp = null; render(); { const el = $('#f-nombre'); if (el) el.focus(); } break;
    case 'emp-edit': { const e = S.employees.find(x => x.id === id); if (e) { ui.form = formFromEmp(e); ui.imp = null; render(); const el = $('#f-nombre'); if (el) el.focus(); } break; }
    case 'emp-cancel': ui.form = null; render(); break;
    case 'emp-del': ui.confirm = 'del:' + id; render(); break;
    case 'emp-del-yes': S.employees = S.employees.filter(e => e.id !== id); Object.keys(S.novedades).forEach(k => { delete S.novedades[k][id]; }); ui.confirm = null; save(); render(); break;
    case 'cam-add': readForm(); ui.form.cambios.push({ desde: '', salario: '' }); render(); break;
    case 'cam-del': readForm(); ui.form.cambios.splice(+t.dataset.i, 1); render(); break;
    case 'emp-save': {
      readForm(); const errs = validarForm(); ui.form.err = errs;
      if (errs.length) { render(); const el = $('.formcard'); if (el) el.scrollIntoView({ block: 'start' }); break; }
      const f = ui.form, hasta = Math.max(0, Math.min(11, Math.round(num(f.sHasta))));
      const e = { id: f.id || uid(), nombre: f.nombre.trim(), identidad: digits(f.identidad), cargo: f.cargo.trim(), ingreso: f.ingreso, retiro: f.retiro || '', salario: num(f.salario), jornada: f.jornada, ihss: f.ihss, rap: f.rap, gastosMedicos: num(f.gastosMedicos), descuentoJudicial: num(f.descuentoJudicial), otrasFijas: num(f.otrasFijas), cambios: f.cambios.filter(c => /^\d{4}-\d{2}$/.test(c.desde) && num(c.salario) > 0).map(c => ({ desde: c.desde, salario: num(c.salario) })), saldo: hasta > 0 ? { anio: S.sel.anio, hasta, ingreso: num(f.sIng), isr: num(f.sIsr) } : null };
      const i = S.employees.findIndex(x => x.id === e.id); if (i >= 0) S.employees[i] = e; else S.employees.push(e);
      save(); ui.form = null; render(); toast('Empleado guardado.'); break;
    }
    case 'tpl': if (typeof XLSX === 'undefined') toast('La librería de Excel no cargó.'); else await saveFile('nominahn-plantilla.xlsx', plantillaXlsx()); break;
    case 'imp-cancel': ui.imp = null; render(); break;
    case 'imp-apply': aplicarImport(); break;
    case 'exp': ui.exp[id] = !ui.exp[id]; render(); break;
    case 'xlsx-planilla': if (typeof XLSX === 'undefined') toast('La librería de Excel no cargó.'); else await saveFile(`nominahn-planilla-${S.sel.anio}-${String(S.sel.mes).padStart(2, '0')}.xlsx`, planillaXlsx()); break;
    case 'xlsx-decimos': if (typeof XLSX === 'undefined') toast('La librería de Excel no cargó.'); else await saveFile(`nominahn-decimo-${ui.decTipo}-${S.sel.anio}.xlsx`, decimosXlsx()); break;
    case 'pdf-boletas': { if (!window.jspdf) { toast('La librería de PDF no cargó.'); break; } const buf = boletasPdf(); if (buf) await saveFile(`nominahn-boletas-${S.sel.anio}-${String(S.sel.mes).padStart(2, '0')}.pdf`, buf); break; }
    case 'dec-tipo': ui.decTipo = +t.dataset.t; render(); break;
  }
});
document.addEventListener('change', async ev => {
  const t = ev.target, d = t.dataset || {};
  if (t.id === 'selMes') { S.sel.mes = +t.value; save(); render(); return; }
  if (t.id === 'selAnio') { S.sel.anio = +t.value; save(); render(); return; }
  if (t.id === 'fileEmp' && t.files[0]) { await importFile(t.files[0]); t.value = ''; return; }
  if (t.id === 'fileBackup' && t.files[0]) {
    try { const o = JSON.parse(await t.files[0].text()); if (!Array.isArray(o.employees) || !o.params || !o.sel) throw new Error('x'); ui.stash = o; ui.confirm = 'import'; render(); }
    catch (e) { toast('Ese archivo no es un respaldo de NóminaHN.'); } t.value = ''; return;
  }
  if (d.nov) { const k = ymKey(S.sel.anio, S.sel.mes); S.novedades[k] = S.novedades[k] || {}; const o = S.novedades[k][d.emp] = S.novedades[k][d.emp] || {}; const v = Math.max(0, num(t.value)); if (v) o[d.nov] = v; else delete o[d.nov]; save(); const s = $('#novStatus'); if (s) s.textContent = 'Guardado'; return; }
  if (d.val !== undefined) { const p = S.params[d.vy ? +d.vy : ui.pyear]; if (p) { p.val = p.val || {}; if (t.checked) p.val[d.val] = hoyISO(); else delete p.val[d.val]; save(); const y = window.scrollY; render(); window.scrollTo(0, y); } return; }
  if (d.co) { S.company[d.co] = d.co === 'salarioMinimo' ? num(t.value) : t.value; save(); return; }
  if (d.p) { const p = S.params[ui.pyear]; const v = d.u === '%' ? num(t.value) / 100 : num(t.value); setP(p, d.p, v); save(); toast('Parámetro guardado.'); return; }
  if (d.tr !== undefined) { const p = S.params[ui.pyear], row = p.isr.tramos[+d.tr]; row[d.k] = d.k === 'tasa' ? num(t.value) / 100 : num(t.value); save(); toast('Tramo guardado.'); return; }
  if (t.id === 'decEmp') { ui.decEmp = t.value; render(); return; }
  if (t.id === 'decVar') { ui.decVar = t.checked; render(); return; }
  if (t.id === 'decProm') { ui.decProm = num(t.value); render(); return; }
  if (t.id === 'pyear') { ui.pyear = +t.value; render(); return; }
});
document.addEventListener('keydown', ev => { if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('label.btn[for]')) { ev.preventDefault(); const f = document.getElementById(ev.target.getAttribute('for')); if (f) f.click(); } });
window.addEventListener('hashchange', () => { ui.form = null; ui.imp = null; ui.confirm = null; render(false); });
render(false);
})();
